<div class="auth-page">
  <div class="auth-glow"></div>

  <header class="auth-header">
    <a routerLink="/" class="nav-logo">
      <span>STREET</span><span class="accent">GUITAR</span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card-header">
        <a routerLink="/login" class="fp-back">← Back to Sign In</a>
        <h1 class="auth-title">No password needed</h1>
        <p class="auth-sub">
          Street Guitar uses Google Sign-In — there's no password to reset.
          Just sign in with the Google account you used to register.
        </p>
      </div>
      <a routerLink="/login" class="btn btn-primary btn-lg btn-block" style="margin-top: 8px;">
        Back to Sign In →
      </a>
    </div>
  </main>
</div>
